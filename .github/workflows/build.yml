name: Android validation build

on:
  workflow_call:
    inputs:
      upload_debug_apk:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      upload_debug_apk:
        description: Upload a temporary debug APK
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate word banks
        run: python3 tools/validate_words.py
      - name: Test automation helpers
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Build and validate both variants
        run: >-
          ./gradlew --no-daemon :game-core:test :app:testDebugUnitTest
          :app:assembleDebug :app:lintDebug :app:assembleRelease :app:lintRelease
      - name: Verify debug APK identity
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/debug-badging.txt"
          grep -F "package: name='com.armadillo.game'" "$RUNNER_TEMP/debug-badging.txt"
          grep -F "launchable-activity: name='com.armadillo.game.MainActivity'" "$RUNNER_TEMP/debug-badging.txt"
      - name: Report JVM test totals
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          reports = glob.glob('*/build/test-results/**/TEST-*.xml', recursive=True)
          if not reports:
              raise SystemExit('No JVM test reports were produced')
          counts = [ET.parse(path).getroot() for path in reports]
          print('JVM tests: {} run, {} failed, {} skipped'.format(
              sum(int(r.get('tests', 0)) for r in counts),
              sum(int(r.get('failures', 0)) + int(r.get('errors', 0)) for r in counts),
              sum(int(r.get('skipped', 0)) for r in counts)))
          PY
      - name: Upload temporary debug APK
        if: inputs.upload_debug_apk
        # Quota failure is a warning, not a false build failure.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: armadillo-ci-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
