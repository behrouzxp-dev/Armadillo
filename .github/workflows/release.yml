name: Signed release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable version tag, for example v1.1.0
        required: true
        type: string

permissions:
  contents: read

# Serialize all releases, not just releases for the same tag.
concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      code: ${{ steps.check.outputs.code }}
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - name: Check out approved main commit and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check owner, main, version and release history
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RELEASE_ACTOR_ALLOWLIST: ${{ vars.RELEASE_ACTOR_ALLOWLIST }}
        run: python3 tools/release_preflight.py

  validate:
    needs: preflight
    uses: ./.github/workflows/build.yml
    with:
      upload_debug_apk: false
    permissions:
      contents: read

  security:
    needs: preflight
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  sign:
    needs: [preflight, validate, security]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the approved main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Build signed release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/armadillo-release.jks
        run: |
          set -euo pipefail
          trap 'rm -f "$RELEASE_KEYSTORE_PATH"' EXIT
          for name in KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required signing secret $name is not available to the workflow."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_PATH"
          test -s "$RELEASE_KEYSTORE_PATH"
          unset KEYSTORE_BASE64
          ./gradlew --no-daemon :app:verifyReleaseSigning :app:assembleRelease :app:bundleRelease
      - name: Verify APK metadata and original signing certificate
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          VERSION_CODE: ${{ needs.preflight.outputs.code }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          bundle=app/build/outputs/bundle/release/app-release.aab
          if [ ! -s "$apk" ] || [ ! -s "$bundle" ]; then
            echo "::error::Signed APK or AAB output is missing or empty."
            exit 1
          fi
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME/build-tools" ]; then
            echo "::error::Android SDK build-tools directory is missing."
            exit 1
          fi
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          if [ ! -x "$build_tools/apksigner" ] || [ ! -x "$build_tools/aapt" ]; then
            echo "::error::Android build tools do not contain executable apksigner and aapt."
            exit 1
          fi
          if ! "$build_tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/signature.txt" 2>&1; then
            echo "::error::APK signature verification failed."
            cat "$RUNNER_TEMP/signature.txt"
            exit 1
          fi
          if ! "$build_tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt" 2>&1; then
            echo "::error::APK metadata inspection failed."
            cat "$RUNNER_TEMP/badging.txt"
            exit 1
          fi
          if ! jarsigner -verify "$bundle" > "$RUNNER_TEMP/jarsigner.txt" 2>&1; then
            echo "::error::AAB signature verification failed."
            cat "$RUNNER_TEMP/jarsigner.txt"
            exit 1
          fi
          if ! keytool -printcert -jarfile "$bundle" > "$RUNNER_TEMP/bundle-cert.txt" 2>&1; then
            echo "::error::AAB signing certificate inspection failed."
            cat "$RUNNER_TEMP/bundle-cert.txt"
            exit 1
          fi
          python3 - "$RUNNER_TEMP/signature.txt" "$RUNNER_TEMP/badging.txt" "$RUNNER_TEMP/bundle-cert.txt" <<'PY'
          import os, re, sys
          from pathlib import Path
          # Keep this fingerprint in sync with README.md, CHANGELOG.md and docs/RELEASE_GUIDE.md.
          cert = '4f405db1954c1740566536b8568c4bae56d5a1e6184c2110cd3239af529826b8'
          report, badging, bundle = (Path(p).read_text(encoding='utf-8') for p in sys.argv[1:])
          def fail(message):
              print(f'::error::{message}')
              raise SystemExit(1)
          signers = re.findall(r'certificate SHA-256 digest:\s*([0-9a-fA-F:]+)', report)
          if len(signers) != 1:
              fail(f'APK must have exactly one signing certificate; found {len(signers)}.')
          if signers[0].replace(':', '').lower() != cert:
              fail('APK signing certificate does not match the original release signing certificate.')
          bundle_certs = re.findall(r'SHA256:\s*([0-9A-Fa-f:]+)', bundle)
          if len(bundle_certs) != 1:
              fail(f'AAB must have exactly one SHA-256 signing certificate; found {len(bundle_certs)}.')
          if bundle_certs[0].replace(':', '').lower() != cert:
              fail('AAB signing certificate does not match the original release key.')
          package = next((line for line in badging.splitlines() if line.startswith('package: ')), '')
          matches = re.findall(r"(?:^|\s)(name|versionCode|versionName)='([^']*)'", package)
          fields = dict(matches)
          if len(matches) != 3 or fields != {'name': 'com.armadillo.game', 'versionCode': os.environ['VERSION_CODE'], 'versionName': os.environ['VERSION']}:
              fail('APK package ID, version name or version code does not match the approved release.')
          print('APK and AAB signatures, application ID and APK version verified.')
          PY
          if ! (cd app/build/outputs && sha256sum apk/release/app-release.apk bundle/release/app-release.aab > SHA256SUMS); then
            echo "::error::Could not generate signed artifact checksums."
            exit 1
          fi
      - name: Upload verified signed files for publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: armadillo-ci-signed-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/output-metadata.json
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [preflight, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified signed files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: armadillo-ci-signed-release
          path: release-files
      - name: Verify checksums and publish a new release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
        run: |
          set -euo pipefail
          cd release-files
          sha256sum --check SHA256SUMS
          # A failed publication must not leave an orphan tag/draft that blocks retries.
          created=0
          cleanup_incomplete_release() {
            if [ "$created" = 1 ]; then
              echo '::notice::Removing the incomplete draft and tag created by this run.'
              gh release delete "$RELEASE_TAG" --yes --cleanup-tag > /dev/null 2>&1 || true
              gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$RELEASE_TAG" > /dev/null 2>&1 || true
            fi
          }
          trap cleanup_incomplete_release EXIT
          # Create only a new tag; the API rejects an existing ref without changing it.
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_COMMIT" > /dev/null
          created=1
          # Draft releases do not create tags until publication, so create the ref first.
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "Armadillo $RELEASE_TAG" \
            --notes "Owner-approved signed Android release. Verify SHA256SUMS before installing." \
            apk/release/app-release.apk bundle/release/app-release.aab SHA256SUMS apk/release/output-metadata.json
          tag_commit="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object | select(.type == "commit") | .sha')"
          test "$tag_commit" = "$RELEASE_COMMIT" || { echo '::error::Release tag does not point to the approved commit.'; exit 1; }
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort > "$RUNNER_TEMP/assets.txt"
          printf '%s\n' SHA256SUMS app-release.aab app-release.apk output-metadata.json | sort > "$RUNNER_TEMP/expected-assets.txt"
          diff -u "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/assets.txt"
          tag_commit="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object | select(.type == "commit") | .sha')"
          test "$tag_commit" = "$RELEASE_COMMIT" || { echo '::error::Release tag does not point to the approved commit.'; exit 1; }
          gh release edit "$RELEASE_TAG" --draft=false
          trap - EXIT
