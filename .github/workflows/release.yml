name: Signed release

# Owner-approved, manually dispatched release build. It produces a signed APK and
# AAB from the secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and
# KEY_PASSWORD, verifies the signature, and attaches the artifacts plus checksums
# to the GitHub Release of the requested tag. The workflow never creates a tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and attach artifacts to, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: signed-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag }}
      # app/build.gradle.kts reads these four variables and refuses a partial set.
      RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/.signing/armadillo-release.jks
      RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Materialise the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is empty; a signed release cannot be built."
            exit 1
          fi
          umask 077
          mkdir -p "$(dirname "$RELEASE_KEYSTORE_PATH")"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 -d > "$RELEASE_KEYSTORE_PATH"
          test -s "$RELEASE_KEYSTORE_PATH"
          echo "Keystore materialised ($(stat -c%s "$RELEASE_KEYSTORE_PATH") bytes)."

      - name: Check that the tag matches the Gradle version
        run: |
          set -euo pipefail
          version="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)"
          code="$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)"
          echo "Gradle versionName=$version versionCode=$code tag=$TAG"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName $version in app/build.gradle.kts."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG does not exist in this repository."
            exit 1
          fi

      - name: Validate word banks and run tests
        run: |
          set -o pipefail
          python3 tools/validate_words.py
          ./gradlew --no-daemon :game-core:test :app:testDebugUnitTest

      - name: Build the signed APK and AAB
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify the release signature
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee signature.txt
          if ! grep -q '^Signer #1 certificate SHA-256 digest:' signature.txt; then
            echo "::error::apksigner did not report a signer for $APK."
            exit 1
          fi
          grep '^Signer #1 certificate SHA-256 digest:' signature.txt | while IFS= read -r line; do
            echo "::notice::$line"
          done
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | grep -E "^package:" | while IFS= read -r line; do
            echo "::notice::$line"
          done

      - name: Write checksums
        run: |
          set -euo pipefail
          cd app/build/outputs
          sha256sum apk/release/app-release.apk bundle/release/app-release.aab > SHA256SUMS
          cat SHA256SUMS

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::No GitHub Release exists for tag $TAG. Create the release first; this workflow never creates tags or releases."
            exit 1
          fi
          gh release upload "$TAG" \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab \
            app/build/outputs/SHA256SUMS \
            app/build/outputs/apk/release/output-metadata.json \
            --clobber

      - name: Remove the keystore
        if: always()
        run: rm -rf "$(dirname "$RELEASE_KEYSTORE_PATH")"
