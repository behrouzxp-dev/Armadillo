name: Android build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/debug-apk.yml
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate bundled word banks
        run: python3 tools/validate_words.py
      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Verify APK identity and launcher
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='com.armadillo.game'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "launchable-activity: name='com.armadillo.game.MainActivity'" "$RUNNER_TEMP/apk-badging.txt"
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: armadillo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Run unit tests and lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # Verifies R8 minification, resource shrinking and release lint without signing
      # material. Signed releases stay a manual, owner-approved step.
      - name: Assemble unsigned release and run release lint
        run: ./gradlew --no-daemon :app:assembleRelease :app:lintRelease
