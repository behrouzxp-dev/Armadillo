name: Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/9adb9043-armadillo
    paths:
      - .github/workflows/debug-apk.yml

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Verify APK identity and launcher
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='com.armadillo.game'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "launchable-activity: name='com.armadillo.game.MainActivity'" "$RUNNER_TEMP/apk-badging.txt"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: armadillo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Run unit tests and lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug
