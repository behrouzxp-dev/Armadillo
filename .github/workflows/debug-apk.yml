name: Android build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/debug-apk.yml
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate bundled word banks
        run: python3 tools/validate_words.py
      - name: Assemble debug APK
        run: |
          set +e
          ./gradlew --no-daemon :app:assembleDebug > gradle-assemble.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E "^e: |error:|FAILED|Execution failed|What went wrong" -A2 gradle-assemble.log \
              | head -60 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          tail -30 gradle-assemble.log
          exit "$status"
      - name: Verify APK identity and launcher
        run: |
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='com.armadillo.game'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "launchable-activity: name='com.armadillo.game.MainActivity'" "$RUNNER_TEMP/apk-badging.txt"
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: armadillo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Run unit tests and lint
        run: |
          set +e
          ./gradlew --no-daemon :game-core:test :app:testDebugUnitTest :app:lintDebug > gradle-check.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            # Surface the reason as check-run annotations; the raw log needs repository access.
            grep -E "FAILED|not mocked|Stub!|^e: |error:|Execution failed|failing tests|Lint found" gradle-check.log \
              | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          tail -30 gradle-check.log
          exit "$status"

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # Verifies R8 minification, resource shrinking and release lint without signing
      # material. Signed releases stay a manual, owner-approved step.
      - name: Assemble unsigned release and run release lint
        run: |
          set +e
          ./gradlew --no-daemon :app:assembleRelease :app:lintRelease > gradle-release.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E "^e: |error:|FAILED|Execution failed|What went wrong|Lint found" -A2 gradle-release.log \
              | head -60 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          tail -30 gradle-release.log
          exit "$status"
