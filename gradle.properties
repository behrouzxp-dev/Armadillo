# AGP 9 lints the release variant inside the build JVM; the previous 512m/384m caps made
# lint die with OutOfMemoryError: Metaspace on CI.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseSerialGC
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official
